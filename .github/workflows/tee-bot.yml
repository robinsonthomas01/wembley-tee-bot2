name: Tee bot

# Everything in one file: setup, the 6am drop, the cancellation scanner,
# and anything you trigger by hand.

on:
  workflow_dispatch:
    inputs:
      do:
        description: "What to do"
        type: choice
        required: true
        default: setup
        options: [setup, drop-now, rehearse, refresh, scan-now, book, cancel, move]
      resource:
        description: "Course, e.g. OLD_18 (book/move only)"
        required: false
        default: ""
      date:
        description: "Date, e.g. 2026-08-30 (book/move only)"
        required: false
        default: ""
      time:
        description: "Tee time, e.g. 07:20 (book/move only)"
        required: false
        default: ""
      players:
        description: "How many players"
        required: false
        default: "1"
      cancel_url:
        description: "Cancel link (cancel/move only)"
        required: false
        default: ""

  schedule:
    # The 6am release, and nothing else.
    #
    # AWST is UTC+8, so 06:00 Perth = 22:00 UTC the day before. Wembley's
    # queue opens a few minutes before the hour and position is decided by
    # arrival, so the job must already be watching. GitHub's scheduler can run
    # 15 minutes late, so start at 21:00 UTC (05:00 Perth) - that still leaves
    # half an hour of slack before the queue could possibly open.
    - cron: "0 21 * * *"

concurrency:
  group: tee-bot-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WGC_USERNAME: ${{ secrets.WGC_USERNAME }}
      WGC_PASSWORD: ${{ secrets.WGC_PASSWORD }}
      WGC_VAPID_PRIVATE: ${{ secrets.WGC_VAPID_PRIVATE }}
      WGC_VAPID_SUBJECT: ${{ secrets.WGC_VAPID_SUBJECT }}
      WGC_EMAIL_USER: ${{ secrets.WGC_EMAIL_USER }}
      WGC_EMAIL_PASSWORD: ${{ secrets.WGC_EMAIL_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tidy the repository layout
        run: |
          # Dragging a folder into GitHub often nests everything one level
          # deep. Straighten that out rather than making you re-upload.
          if [ ! -d bot ]; then
            NEST=$(find . -maxdepth 3 -type d -name bot -not -path './.git/*' | head -1)
            if [ -n "$NEST" ]; then
              SUB=$(dirname "$NEST")
              echo "Files were nested inside '$SUB'. Moving them up."
              cp -rn "$SUB"/. . 2>/dev/null || true
              rm -rf "$SUB"
              git config user.name  "tee-bot"
              git config user.email "tee-bot@users.noreply.github.com"
              git add -A
              git diff --staged --quiet || git commit -m "move files to top level"
              git push || true
            fi
          fi

      - name: Sync the bot modules from teebot.py
        run: |
          # teebot.py is the source of truth. Unpack every run so that pasting
          # an updated bundle actually replaces the old modules.
          if [ -f teebot.py ]; then
            python -c "import teebot; teebot.unpack()"
            git config user.name  "tee-bot"
            git config user.email "tee-bot@users.noreply.github.com"
            git add bot
            git diff --staged --quiet || git commit -m "sync bot modules from teebot.py"
            git push || true
          fi

      - name: Check the files are all here
        run: |
          MISSING=""
          for f in bot/__init__.py bot/config.py bot/client.py bot/miclub.py \
                   bot/drop.py bot/scan.py bot/act.py bot/snapshot.py \
                   bot/calibrate.py bot/match.py bot/state.py bot/notify.py \
                   bot/push.py recon.py config.yaml; do
            [ -e "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These files are missing from your repository:"
            for f in $MISSING; do echo "::error::   $f"; done
            {
              echo "### Missing files"
              echo ""
              for f in $MISSING; do echo "- \`$f\`"; done
              echo ""
              echo "**Easiest fix:** add a single file called \`teebot.py\` to the"
              echo "top level of this repository. It contains all the \`bot/\`"
              echo "modules and unpacks itself on the next run."
              echo ""
              echo "GitHub's uploader drops folders fairly often, which is why"
              echo "that file exists."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required files present."

      - name: Install what Python needs
        run: |
          # Named directly so a missing requirements.txt can't stop the job.
          pip install --quiet requests beautifulsoup4 PyYAML pywebpush

      - name: Work out what to do
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.do }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=drop" >> "$GITHUB_OUTPUT"
          fi

      - name: Check your Wembley login is saved
        run: |
          if [ -z "$WGC_USERNAME" ] || [ -z "$WGC_PASSWORD" ]; then
            echo "::error::Add WGC_USERNAME and WGC_PASSWORD under Settings >"
            echo "::error::Secrets and variables > Actions, then run this again."
            exit 1
          fi

      # ---------------------------------------------------------- setup
      - name: Find the course IDs
        if: steps.mode.outputs.mode == 'setup'
        run: |
          set -o pipefail
          python recon.py 2>&1 | tee -a /tmp/teebot.log

      - name: Work out the real booking lead time
        if: steps.mode.outputs.mode == 'setup'
        run: |
          set -o pipefail
          python -m bot.calibrate --write 2>&1 | tee -a /tmp/teebot.log || true

      # ------------------------------------------------------- scheduled
      - name: Wait for 6am and book
        if: steps.mode.outputs.mode == 'drop'
        run: |
          set -o pipefail
          python -m bot.drop 2>&1 | tee -a /tmp/teebot.log

      - name: Book right now, skipping the wait
        if: steps.mode.outputs.mode == 'drop-now'
        run: |
          set -o pipefail
          python -m bot.drop --now 2>&1 | tee -a /tmp/teebot.log

      - name: Dress rehearsal
        if: steps.mode.outputs.mode == 'rehearse'
        run: |
          set -o pipefail
          python -m bot.drop --rehearse 6 2>&1 | tee -a /tmp/teebot.log

      # Cancellation scanning is switched off for now. `scan-now` still works
      # by hand if you want to try it.
      - name: Look for cancellations
        if: steps.mode.outputs.mode == 'scan-now'
        run: |
          set -o pipefail
          python -m bot.scan 2>&1 | tee -a /tmp/teebot.log

      # ------------------------------------------------------- on demand
      - name: Do it
        if: contains(fromJSON('["book","cancel","move","refresh"]'), steps.mode.outputs.mode)
        run: |
          set -o pipefail
          python -m bot.act --do "${{ steps.mode.outputs.mode }}" \
            --resource "${{ inputs.resource }}" \
            --date "${{ inputs.date }}" \
            --time "${{ inputs.time }}" \
            --players "${{ inputs.players || 1 }}" \
            --cancel-url "${{ inputs.cancel_url }}" 2>&1 | tee -a /tmp/teebot.log

      # -------------------------------------------------------- always
      - name: Refresh the cached tee sheets
        if: steps.mode.outputs.mode == 'setup'
        continue-on-error: true
        run: |
          set -o pipefail
          python -m bot.snapshot 2>&1 | tee -a /tmp/teebot.log

      - name: Keep the pages recon looked at
        if: always() && steps.mode.outputs.mode == 'setup'
        uses: actions/upload-artifact@v4
        with:
          name: recon-pages
          path: recon_dump/
          retention-days: 7
          if-no-files-found: ignore

      - name: What went wrong
        if: failure()
        run: |
          {
            echo "### It didn't work"
            echo ""
            if [ -s /tmp/teebot.log ]; then
              echo "Last thing it said:"
              echo ""
              echo '```'
              tail -n 40 /tmp/teebot.log
              echo '```'
            else
              echo "It failed before reaching Wembley. Check the red step above."
            fi
            echo ""
            echo "**Common causes**"
            echo ""
            echo "| What you'd see | What it means |"
            echo "|---|---|"
            echo "| \`rejected those credentials\` | Wrong member number or password. Your username is your membership number with leading zeros removed: \`00035\` becomes \`35\`. |"
            echo "| \`403\` or \`Forbidden\` | Wembley is blocking GitHub's servers. Tell me and we'll switch to the Chrome extension, which runs from your own computer. |"
            echo "| \`No password form found\` | Wembley changed their login page. Send me this log. |"
            echo "| \`No bookingResourceId found\` | Logged in, but the courses weren't where expected. Send me this log. |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/teebot.log ]; then
            tail -n 12 /tmp/teebot.log | while read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Save what happened
        if: always()
        run: |
          git config user.name  "tee-bot"
          git config user.email "tee-bot@users.noreply.github.com"
          git add site.yaml config.yaml state.json sheets.json bookings.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "${{ steps.mode.outputs.mode }}"
          git pull --rebase --autostash || true
          git push || true

      - name: Summary
        if: steps.mode.outputs.mode == 'setup'
        run: |
          {
            echo "### Setup finished"
            echo ""
            echo "Course IDs found:"
            echo '```'
            grep -A1 -E "^  (OLD|TUART)_" site.yaml || cat site.yaml
            echo '```'
            echo "**Next:** open \`config.yaml\` and set the days and times you play."
            echo "It stays in practice mode until you set \`dry_run: false\`."
          } >> "$GITHUB_STEP_SUMMARY"
